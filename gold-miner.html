<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LinkPlay 黄金矿工</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="gold-miner.css" />
    <script defer src="net-client.js"></script>
    <script defer src="room-panel-shared.js"></script>
    <script defer src="authoritative-room.js"></script>
    <script defer src="gold-miner-rules.js"></script>
    <script defer src="gold-miner.js"></script>
  </head>
  <body class="gold-miner-page">
    <div class="gold-shell">
      <aside class="gold-sidebar">
        <div class="brand">
          <div class="brand-mark">LP</div>
          <h1>黄金矿工</h1>
        </div>
        <a class="back-link" href="index.html">返回游戏大厅</a>
        <section class="connection-panel" aria-label="房间面板">
          <div class="panel-title"><h2>房间</h2><span id="roomStatus">未进入房间</span></div>
          <label>昵称<input id="nicknameInput" maxlength="16" autocomplete="off" /></label>
          <div class="button-grid">
            <button id="hostBtn" class="primary-btn" type="button">创建房间</button>
            <button id="joinBtn" type="button">加入房间</button>
            <button id="leaveRoomBtn" type="button" hidden>退出房间</button>
          </div>
          <label>房间号<input id="roomInput" maxlength="8" autocomplete="off" placeholder="GM……" /></label>
          <div class="share-box">
            <input id="shareInput" aria-label="邀请链接" readonly placeholder="邀请链接" />
            <button id="copyBtn" type="button">复制</button>
          </div>
          <ul id="roomMemberList" class="member-list" aria-label="房间成员"></ul>
        </section>
        <section class="gold-config" aria-label="比赛配置">
          <h2>比赛</h2>
          <label>模式<select id="goldMode"><option value="shared">共享抢矿</option><option value="independent">独立竞速</option></select></label>
          <label>比赛时长（秒）<input id="goldDuration" type="number" inputmode="numeric" min="10" max="600" step="1" value="90" required /></label>
          <p class="gold-rule">10–600 秒整数 · 2–6 人</p>
          <button id="goldStart" type="button" class="primary-btn" disabled>开始比赛</button>
        </section>
      </aside>
      <main class="gold-stage">
        <header class="gold-stage-header">
          <div><h2 id="goldModeLabel">共享抢矿</h2><p id="goldRoundLabel">等待开局</p></div>
          <div class="gold-clock"><span id="goldClockLabel">比赛时长</span><strong id="goldClock">90<span>秒</span></strong></div>
          <div class="gold-wallet"><span>我的总价值</span><strong id="goldMyScore">¥0</strong></div>
        </header>
        <section class="gold-play-area" id="goldPlayArea" tabindex="0" aria-label="矿场操作区，按空格放钩">
          <canvas id="goldCanvas" width="960" height="620" aria-label="黄金矿工矿场"></canvas>
          <div id="goldOverlay" class="gold-overlay"><strong>准备下矿</strong><span>创建房间或加入朋友的邀请</span></div>
          <div class="gold-action-bar">
            <p id="goldMessage" role="status" aria-live="polite">等待房主开始比赛</p>
            <button id="goldDrop" type="button" disabled>放钩 <kbd>空格</kbd></button>
          </div>
        </section>
        <p id="goldError" class="gold-error" role="alert" hidden></p>
        <p id="goldAssetError" class="gold-error" role="status" hidden></p>
        <section class="gold-results" aria-label="价值排行">
          <div class="gold-ranking-header"><h2 id="goldRankTitle">实时排行</h2><span id="goldModeHint">同一矿场，先抓先得</span></div>
          <ol id="goldRankings" class="gold-rankings"><li class="gold-ranking-empty">等待矿工入场</li></ol>
          <p id="goldWinner" class="gold-winner" hidden></p>
        </section>
      </main>
    </div>
  </body>
</html>
