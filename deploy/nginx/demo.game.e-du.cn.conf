# demo.game.e-du.cn —— LinkPlay 小游戏平台（自建 Node + WebSocket 服务）
# 2026-09-18 新增。上游：127.0.0.1:48230（systemd psn-game-platform.service）
# 与 pangbao 各业务线完全独立：独立目录 /opt/psn-game-platform、独立端口、独立进程。
#
# 【为什么单独一支】游戏房间服务是 Node 长连接进程，与 Java/Go 业务线无任何耦合，
# 单独域名 + 单独端口便于独立回滚（停 unit + 移走本文件即可，不影响其他站点）。
#
# 【证书别动】acme.sh webroot 模式签发（ec-256），webroot 是 /xp/www/demo.game.e-du.cn，
# 80 段与 443 段的 /.well-known/ 必须原样保留，否则自动续期会失败。
server {
    listen 80;
    server_name demo.game.e-du.cn;
    root /xp/www/demo.game.e-du.cn;

    # SSL证书验证目录:必须在跳转之前,否则 acme.sh 续期拿不到 challenge 文件
    location /.well-known/ {
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }

    access_log /xp/wwwlogs/demo.game.e-du.cn.log;
    error_log  /xp/wwwlogs/demo.game.e-du.cn.error.log;
}

server {
    listen 443 ssl http2;
    server_name demo.game.e-du.cn;

    ssl_certificate     /xp/panel/vhost/ssl/demo.game.e-du.cn/fullchain.pem;
    ssl_certificate_key /xp/panel/vhost/ssl/demo.game.e-du.cn/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # 续期兜底:HTTP-01 走 80,这里保留只是防止有人配成 https challenge
    location /.well-known/ {
        root /xp/www/demo.game.e-du.cn;
        allow all;
    }

    # 静态资源与 JSON 响应都压一下(游戏页面的 js/css 体积不大,收益有限但无副作用)
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1k;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript
               application/javascript application/x-javascript
               application/json image/svg+xml;

    # ── WebSocket：游戏房间长连接 ──────────────────────────────
    # $connection_upgrade 由 0_ws.conf 的 map 提供（无 Upgrade 头时为 close，
    # 保证普通请求不被强升连接）。读超时必须给足，否则对局中会被 Nginx 掐断。
    location /ws {
        proxy_pass http://127.0.0.1:48230;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # ── 静态页面与 /health ────────────────────────────────────
    location / {
        proxy_pass http://127.0.0.1:48230;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    access_log /xp/wwwlogs/demo.game.e-du.cn.log;
    error_log  /xp/wwwlogs/demo.game.e-du.cn.error.log;
}
