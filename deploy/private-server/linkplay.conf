# 私有服务器 HTTP IP 首次发布；仅开放 8881，内部服务只在回环。
map $http_upgrade $linkplay_connection_upgrade {
    default upgrade;
    '' close;
}
limit_conn_zone $binary_remote_addr zone=linkplay_conn:10m;
limit_req_zone $binary_remote_addr zone=linkplay_match:10m rate=5r/s;

server {
    listen 8881 default_server;
    listen [::]:8881 default_server;
    server_name _;
    server_tokens off;
    client_max_body_size 64k;
    client_body_timeout 15s;
    client_header_timeout 15s;
    access_log /var/log/nginx/linkplay.access.log;
    error_log /var/log/nginx/linkplay.error.log warn;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $linkplay_connection_upgrade;

    # 1. 网络模式是部署声明，不按浏览器 hostname 猜测，不缓存。
    location = /api/arcade-network.js {
        default_type application/javascript;
        add_header Cache-Control no-store;
        return 200 'window.LINKPLAY_ARCADE_PROXY = true;\n';
    }
    # 2. 坦克同时需要 HTTP 匹配和 WebSocket 房间，前缀统一剥离。
    location /tanks/ {
        limit_conn linkplay_conn 20;
        limit_req zone=linkplay_match burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:2567/;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
    # 3. 冒险世界只经同源固定路径接入；人数查询同样经过代理。
    location /quest/ {
        limit_conn linkplay_conn 20;
        proxy_pass http://127.0.0.1:8093/;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
    # 4. 原有平台协议保持 /ws，不与两款独立世界混用。
    location = /ws {
        limit_conn linkplay_conn 20;
        proxy_pass http://127.0.0.1:8080;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
    # 5. 运行依赖、运维配置和内部文档不通过静态根暴露；许可 source 包独立提供。
    location ~ (^|/)\. { return 404; }
    location ~ /node_modules/ { return 404; }
    location ~ ^/(server/|tests/|deploy/|docs/|integrations/|package(-lock)?\.json$|server\.js$|README\.md$) { return 404; }
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_read_timeout 30s;
    }
}
